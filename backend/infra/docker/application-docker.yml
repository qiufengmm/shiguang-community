# Deployment overrides. The tutorial's development files remain unchanged.
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/xiaohashu?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 6
      connection-properties: config.decrypt=false
  data:
    redis:
      host: redis
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 12
  cassandra:
    contact-points: cassandra
    local-datacenter: datacenter1
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        server-addr: nacos:8848
    sentinel:
      transport:
        dashboard: sentinel-dashboard:8060
      datasource:
        degrade:
          nacos:
            serverAddr: nacos:8848
        nacos:
          nacos:
            serverAddr: nacos:8848
    gateway:
      routes:
        - id: auth
          uri: lb://xiaohashu-auth
          predicates: [Path=/auth/**]
          filters: [StripPrefix=1]
        - id: user
          uri: lb://xiaohashu-user
          predicates: [Path=/user/**]
          filters: [StripPrefix=1]
        - id: note
          uri: lb://xiaohashu-note
          predicates: [Path=/note/**]
          filters: [StripPrefix=1]
        - id: user-relation
          uri: lb://xiaohashu-user-relation
          predicates: [Path=/relation/**]
          filters: [StripPrefix=1]
        - id: comment
          uri: lb://xiaohashu-comment
          predicates: [Path=/comment/**]
          filters: [StripPrefix=1]
        - id: search
          uri: lb://xiaohashu-search
          predicates: [Path=/search/**]
          filters: [StripPrefix=1]
        - id: oss
          uri: lb://xiaohashu-oss
          predicates: [Path=/oss/**]
          filters: [StripPrefix=1]

rocketmq:
  name-server: rocketmq-namesrv:9876
elasticsearch:
  address: elasticsearch:9200
  hotUpdateExtDict: /app/dictionary/mydict_hot_update.dic
canal:
  address: canal:11111
  subscribe: xiaohashu.t_note,xiaohashu.t_user,xiaohashu.t_note_count,xiaohashu.t_user_count
xxl:
  job:
    adminAddresses: http://xxl-job-admin:8080/xxl-job-admin
storage:
  type: minio
  minio:
    endpoint: http://minio:9000
    public-base-url: /media/xiaohashu-local
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket-name: xiaohashu-local

xiaohashu:
  frontend:
    enabled: true
tutorial:
  sentinel:
    failure-demo-enabled: false
alarm:
  type: mail
