name: ${COMPOSE_PROJECT_NAME:?required}

x-acceptance-labels: &acceptance-labels
  codex.acceptance.run: ${RUN_ID:?required}
  codex.acceptance.project: xiaohashu

x-app: &app
  restart: "no"
  init: true
  mem_limit: 320m
  labels: *acceptance-labels
  environment: &app-env
    SPRING_PROFILES_ACTIVE: dev,docker
    SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/
    SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
    SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    JAVA_TOOL_OPTIONS: -Xms32m -Xmx160m -Xss320k -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=32m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
  volumes:
    - type: bind
      source: ${APP_CONFIG_FILE:?required}
      target: /app/config/application-docker.yml
      read_only: true
      bind: {create_host_path: false}
  healthcheck:
    test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT}'"]
    interval: 10s
    timeout: 3s
    retries: 18
    start_period: 45s

services:
  mysql:
    image: mysql:8.0.27
    restart: "no"
    mem_limit: 320m
    labels: *acceptance-labels
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: xiaohashu
      TZ: Asia/Shanghai
    command: [mysqld, --innodb-buffer-pool-size=64M, --performance-schema=OFF, --max-connections=80]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 25s

  redis:
    image: redis:8
    restart: "no"
    mem_limit: 96m
    labels: *acceptance-labels
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?required}", --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 5s

  nacos:
    image: nacos/nacos-server:v2.2.3
    restart: "no"
    mem_limit: 320m
    labels: *acceptance-labels
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 64m
      JVM_XMX: 192m
      JVM_XMN: 64m
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport -XX:ActiveProcessorCount=2
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  zookeeper:
    image: zookeeper:3.5.6
    restart: "no"
    mem_limit: 128m
    labels: *acceptance-labels
    environment:
      JVMFLAGS: -Xms32m -Xmx64m
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
      - zookeeper-logs:/logs
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181'"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    restart: "no"
    mem_limit: 160m
    labels: *acceptance-labels
    environment:
      JAVA_OPT_EXT: -Xms32m -Xmx96m -Xmn32m -XX:ActiveProcessorCount=2
      TZ: Asia/Shanghai
    command: [sh, mqnamesrv]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s

  rocketmq-store-init:
    image: apache/rocketmq:5.3.1
    user: "0:0"
    restart: "no"
    mem_limit: 64m
    labels: *acceptance-labels
    volumes:
      - rocketmq-store:/store
    entrypoint: [/bin/sh, -c]
    command: ["chown -R 3000:3000 /store"]

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    restart: "no"
    mem_limit: 512m
    labels: *acceptance-labels
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms64m -Xmx128m -Xmn32m -XX:MaxDirectMemorySize=128m -XX:ActiveProcessorCount=2
      TZ: Asia/Shanghai
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-store-init:
        condition: service_completed_successfully
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - type: bind
        source: ${BROKER_CONFIG_FILE:?required}
        target: /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
        read_only: true
        bind: {create_host_path: false}
    command: [sh, mqbroker, --enable-proxy, -c, /home/rocketmq/rocketmq-5.3.1/conf/broker.conf]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 25s

  cassandra:
    image: cassandra:5.0.4
    restart: "no"
    mem_limit: 640m
    labels: *acceptance-labels
    environment:
      MAX_HEAP_SIZE: 256M
      HEAP_NEWSIZE: 64M
      CASSANDRA_DC: datacenter1
      CASSANDRA_CLUSTER_NAME: xiaohashu-acceptance
    command: [cassandra, -f]
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: [CMD-SHELL, 'cqlsh --request-timeout=5 -e "SELECT release_version FROM system.local" >/dev/null']
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 45s

  distributed-id-generator:
    <<: *app
    image: xiaohashu/distributed-id-generator:local
    environment:
      <<: *app-env
      SERVER_PORT: "8085"
    volumes:
      - type: bind
        source: ${APP_CONFIG_FILE:?required}
        target: /app/config/application-docker.yml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${LEAF_CONFIG_FILE:?required}
        target: /app/config/leaf.properties
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      mysql: {condition: service_healthy}
      zookeeper: {condition: service_healthy}
      nacos: {condition: service_healthy}

  user:
    <<: *app
    image: xiaohashu/user:local
    environment:
      <<: *app-env
      SERVER_PORT: "8082"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rocketmq-broker: {condition: service_healthy}
      distributed-id-generator: {condition: service_healthy}
      nacos: {condition: service_healthy}

  count:
    <<: *app
    image: xiaohashu/count:local
    environment:
      <<: *app-env
      SERVER_PORT: "8090"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rocketmq-broker: {condition: service_healthy}
      nacos: {condition: service_healthy}

  kv:
    <<: *app
    image: xiaohashu/kv:local
    environment:
      <<: *app-env
      SERVER_PORT: "8084"
    depends_on:
      cassandra: {condition: service_healthy}
      rocketmq-broker: {condition: service_healthy}
      nacos: {condition: service_healthy}

  comment:
    <<: *app
    image: ${COMMENT_IMAGE:-xiaohashu/comment:local}
    mem_limit: 448m
    environment:
      <<: *app-env
      SERVER_PORT: "8093"
    ports:
      - target: 8093
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rocketmq-broker: {condition: service_healthy}
      user: {condition: service_healthy}
      count: {condition: service_healthy}
      kv: {condition: service_healthy}
      distributed-id-generator: {condition: service_healthy}
      nacos: {condition: service_healthy}

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:?required}
    labels: *acceptance-labels

volumes:
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME:?required}-mysql
    labels: *acceptance-labels
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:?required}-redis
    labels: *acceptance-labels
  zookeeper-data:
    name: ${COMPOSE_PROJECT_NAME:?required}-zookeeper-data
    labels: *acceptance-labels
  zookeeper-datalog:
    name: ${COMPOSE_PROJECT_NAME:?required}-zookeeper-datalog
    labels: *acceptance-labels
  zookeeper-logs:
    name: ${COMPOSE_PROJECT_NAME:?required}-zookeeper-logs
    labels: *acceptance-labels
  rocketmq-store:
    name: ${COMPOSE_PROJECT_NAME:?required}-rocketmq-store
    labels: *acceptance-labels
  cassandra-data:
    name: ${COMPOSE_PROJECT_NAME:?required}-cassandra
    labels: *acceptance-labels
