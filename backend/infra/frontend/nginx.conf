server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # The Vue client already includes service prefixes (such as /note/note/).
    # Remove /api only; the gateway handles its own StripPrefix filter.
    location /api/ {
        set $gateway gateway:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$gateway$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        # Convert only legacy local MinIO URLs in JSON API responses. Cloud OSS
        # URLs and all other response values pass through unchanged.
        sub_filter_types application/json;
        sub_filter 'http://host.docker.internal:9000/xiaohashu-local/' '/media/xiaohashu-local/';
        sub_filter 'http://127.0.0.1:9000/xiaohashu-local/' '/media/xiaohashu-local/';
        sub_filter 'http://localhost:9000/xiaohashu-local/' '/media/xiaohashu-local/';
        sub_filter_once off;
    }

    # Browser media reads are same-origin. This fixed upstream and bucket do
    # not expose MinIO admin APIs or accept a caller-supplied proxy destination.
    location ^~ /media/xiaohashu-local/ {
        limit_except GET HEAD { deny all; }
        set $minio minio:9000;
        rewrite ^/media/xiaohashu-local/(.*)$ /xiaohashu-local/$1 break;
        proxy_pass http://$minio;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_force_ranges on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control 'no-cache';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
