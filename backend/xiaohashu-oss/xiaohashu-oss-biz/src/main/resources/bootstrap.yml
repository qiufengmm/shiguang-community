spring:
  application:
    name: xiaohashu-oss
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: http://127.0.0.1:8848
        prefix: ${spring.application.name}
        group: DEFAULT_GROUP
        namespace: xiaohashu
        file-extension: yaml
        refresh-enabled: true
      discovery:
        enabled: true
        group: DEFAULT_GROUP
        namespace: xiaohashu
        server-addr: 127.0.0.1:8848
