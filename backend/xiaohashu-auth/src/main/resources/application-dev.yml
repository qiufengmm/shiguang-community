spring:
  data:
    redis:
      database: 0 # Redis 数据库索引（默认为 0）
      host: 127.0.0.1 # Redis 服务器地址
      port: 6379 # Redis 服务器连接端口
      password: qwe123!@# # Redis 服务器连接密码
      timeout: 5s # 读超时时间
      connect-timeout: 5s # 链接超时时间
      lettuce:
        pool:
          max-active: 200 # 连接池最大连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: 0 # 连接池中的最小空闲连接
          max-idle: 10 # 连接池中的最大空闲连接

aliyun: # 接入阿里云（发送短信使用）
  # 从环境变量读取，避免把密钥明文提交进 git
  # IDEA：Run/Debug Configurations -> Environment variables 里加 ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET
  accessKeyId: ${ALIYUN_ACCESS_KEY_ID:}
  accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET:}
  # 号码认证服务-短信认证 赠送的签名与模板（以控制台实际显示为准）
  smsSignName: 速通互联验证码
  smsTemplateCode: "100001"
